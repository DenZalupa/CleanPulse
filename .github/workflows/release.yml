name: Release Executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and run tests
        run: |
          dotnet build CleanPulse.sln -c Release
          dotnet run --project tests/CleanPulse.Tests/CleanPulse.Tests.csproj -c Release --no-build

      - name: Publish framework-dependent single-file exe
        run: dotnet publish src/CleanPulse/CleanPulse.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/portable

      - name: Publish self-contained single-file exe
        run: dotnet publish src/CleanPulse/CleanPulse.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/standalone

      - name: Rename release artifacts
        shell: pwsh
        run: |
          Move-Item dist/portable/CleanPulse.exe dist/CleanPulse-win-x64.exe
          Move-Item dist/standalone/CleanPulse.exe dist/CleanPulse-win-x64-standalone.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CleanPulse-win-x64.exe
            dist/CleanPulse-win-x64-standalone.exe
